services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peerup
      POSTGRES_PASSWORD: peerup
      POSTGRES_DB: peerup
    ports:
      - "5432:5432"
    volumes:
      - peerup_pg:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://peerup:peerup@db:5432/peerup
      SECRET_KEY: peerup-dev-secret
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

volumes:
  peerup_pg:
